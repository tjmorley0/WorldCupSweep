<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sweepstake">
  <meta name="theme-color" content="#0a0f1e">
  <title>World Cup Sweepstake 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --bg2: #111827;
      --bg3: #0d1520;
      --border: #1e2d4a;
      --gold: #c8a84b;
      --green: #7dc46e;
      --green-dark: #1a2f1a;
      --text: #e8eaf0;
      --muted: #8892a4;
      --dim: #5a6a80;
      --blue: #5eb8e0;
      --red: #e07a5e;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      overscroll-behavior: none;
    }

    #app { display: flex; flex-direction: column; min-height: 100dvh; }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #1a2744, #0d1b3e);
      border-bottom: 2px solid var(--gold);
      padding: calc(16px + var(--safe-top)) 20px 16px;
      flex-shrink: 0;
    }
    .header-eyebrow { font-size: 10px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-bottom: 3px; }
    .header h1 { font-size: 22px; font-weight: 800; color: #fff; }
    .header-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }

    /* TABS */
    .tabs {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none; border: none; cursor: pointer;
      padding: 13px 16px; font-size: 13px; font-weight: 600;
      color: var(--dim); white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* CONTENT */
    .content {
      flex: 1;
      padding: 16px 14px calc(16px + var(--safe-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    /* CARDS */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .card.leader { background: linear-gradient(135deg, #1e2d1a, #152010); border-color: #4a7c3f; }

    .player-row {
      display: flex; align-items: center;
      padding: 14px 16px; gap: 12px;
    }
    .medal { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
    .rank-num { color: var(--dim); font-weight: 700; font-size: 13px; }
    .player-info { flex: 1; min-width: 0; }
    .player-name { font-weight: 700; font-size: 16px; }
    .player-name.gold { color: var(--green); }
    .player-teams { font-size: 11px; color: var(--dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-pts { text-align: right; flex-shrink: 0; }
    .pts-num { font-size: 26px; font-weight: 800; color: var(--gold); line-height: 1; }
    .pts-num.gold { color: var(--green); }
    .pts-label { font-size: 10px; color: var(--dim); letter-spacing: 1px; margin-top: 2px; }

    .team-strip { display: flex; background: var(--bg); }
    .team-cell { flex: 1; padding: 6px 2px; text-align: center; border-right: 1px solid var(--bg3); }
    .team-flag { font-size: 14px; line-height: 1.2; }
    .team-pts { font-size: 10px; font-weight: 700; color: var(--dim); }
    .team-pts.active { color: var(--gold); }

    /* SCORING KEY */
    .scoring-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 12px; margin-top: 10px; }
    .scoring-row { display: flex; justify-content: space-between; padding: 2px 0; }
    .scoring-label { color: var(--muted); }
    .scoring-val { color: var(--gold); font-weight: 700; }

    /* SECTION LABEL */
    .section-label { font-size: 10px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }

    /* RESULTS */
    .result-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 14px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .result-date { font-size: 11px; color: var(--dim); min-width: 38px; flex-shrink: 0; }
    .result-match { flex: 1; min-width: 0; }
    .result-score { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .score-num { color: var(--gold); font-size: 15px; font-weight: 800; }
    .result-owners { font-size: 11px; color: var(--blue); margin-top: 2px; }
    .btn-edit { background: #1a2f3a; border: none; color: var(--blue); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; flex-shrink: 0; }
    .btn-delete { background: #2a1a1a; border: none; color: var(--red); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; flex-shrink: 0; }

    /* FORM */
    .form-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .form-title { font-size: 12px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 16px; }
    .form-grid { display: grid; gap: 12px; }
    .form-col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: 11px; color: var(--dim); display: block; margin-bottom: 5px; }
    input, select {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); padding: 11px 12px; border-radius: 8px; font-size: 14px;
      -webkit-appearance: none; appearance: none;
    }
    input:focus, select:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
    input.goals { font-size: 22px; font-weight: 700; text-align: center; }
    .preview {
      background: var(--bg3); border-radius: 8px; padding: 12px;
      text-align: center; font-size: 14px; font-weight: 600;
    }
    .preview-hint { font-size: 12px; color: var(--dim); margin-top: 5px; }
    .btn-primary {
      width: 100%; background: var(--gold); border: none; color: var(--bg);
      padding: 14px; border-radius: 8px; font-weight: 800; font-size: 15px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary {
      background: var(--border); border: none; color: var(--text);
      padding: 14px 18px; border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    .btn-row { display: flex; gap: 10px; }

    /* BONUSES */
    .bonus-pick { margin-bottom: 14px; }
    .bonus-team-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
    .bonus-team-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .bonus-team-left { display: flex; align-items: center; gap: 10px; }
    .bonus-flag { font-size: 28px; }
    .bonus-team-name { font-weight: 700; font-size: 16px; }
    .bonus-team-owner { font-size: 12px; color: var(--dim); }
    .bonus-team-pts { text-align: right; }
    .bonus-pts-num { font-size: 22px; font-weight: 800; color: var(--gold); }
    .bonus-row {
      display: flex; width: 100%; align-items: center; justify-content: space-between;
      padding: 13px 16px; background: transparent;
      border: none; border-bottom: 1px solid var(--bg3);
      cursor: pointer; transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
      text-align: left;
    }
    .bonus-row.on { background: var(--green-dark); }
    .bonus-left { display: flex; align-items: center; gap: 12px; font-size: 14px; }
    .bonus-check { font-size: 18px; }
    .bonus-text { color: var(--muted); }
    .bonus-text.on { color: var(--green); font-weight: 600; }
    .bonus-pts-badge { font-size: 13px; color: var(--gold); font-weight: 700; }

    .all-bonuses { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .bonus-summary-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--bg3); }
    .bonus-badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; flex: 1; }
    .badge { font-size: 10px; background: var(--green-dark); color: var(--green); padding: 2px 6px; border-radius: 4px; }
    .empty-msg { font-size: 13px; color: #3a4a5a; }

    /* INSTALL BANNER */
    .install-banner {
      background: linear-gradient(135deg, #1a2f3a, #0d1b2a);
      border: 1px solid var(--blue);
      border-radius: 10px; padding: 14px 16px;
      margin-bottom: 14px; display: none;
    }
    .install-banner.show { display: flex; align-items: center; gap: 12px; }
    .install-text { flex: 1; font-size: 13px; line-height: 1.5; }
    .install-text strong { color: var(--blue); }
    .btn-dismiss { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; padding: 4px; flex-shrink: 0; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-eyebrow">World Cup 2026</div>
    <h1>Sweepstake Tracker</h1>
    <div class="header-sub">8 players · 48 teams · Updated 17 Jun</div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const PLAYERS = [
  { name:"Paul",    teams:["Canada","Iran","Australia","United States","France","Brazil"] },
  { name:"Joanne",  teams:["Sweden","Egypt","Jordan","Tunisia","Spain","Portugal"] },
  { name:"Cameron", teams:["Netherlands","Panama","Iraq","Uruguay","Belgium","Croatia"] },
  { name:"Ashley",  teams:["South Africa","England","Algeria","Cape Verde Islands","Paraguay","Czech Republic"] },
  { name:"Jessica", teams:["Bosnia and Herzegovina","Switzerland","Congo DR","Mexico","New Zealand","Colombia"] },
  { name:"Evie",    teams:["Ecuador","Morocco","Qatar","Uzbekistan","Scotland","Korea Republic"] },
  { name:"Tristan", teams:["Argentina","Côte d'Ivoire","Haiti","Saudi Arabia","Senegal","Austria"] },
  { name:"Josh",    teams:["Turkey","Norway","Curaçao","Ghana","Japan","Germany"] },
];

const FLAG = {
  "Canada":"🇨🇦","Iran":"🇮🇷","Australia":"🇦🇺","United States":"🇺🇸","France":"🇫🇷","Brazil":"🇧🇷",
  "Sweden":"🇸🇪","Egypt":"🇪🇬","Jordan":"🇯🇴","Tunisia":"🇹🇳","Spain":"🇪🇸","Portugal":"🇵🇹",
  "Netherlands":"🇳🇱","Panama":"🇵🇦","Iraq":"🇮🇶","Uruguay":"🇺🇾","Belgium":"🇧🇪","Croatia":"🇭🇷",
  "South Africa":"🇿🇦","England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Algeria":"🇩🇿","Cape Verde Islands":"🇨🇻","Paraguay":"🇵🇾","Czech Republic":"🇨🇿",
  "Bosnia and Herzegovina":"🇧🇦","Switzerland":"🇨🇭","Congo DR":"🇨🇩","Mexico":"🇲🇽","New Zealand":"🇳🇿","Colombia":"🇨🇴",
  "Ecuador":"🇪🇨","Morocco":"🇲🇦","Qatar":"🇶🇦","Uzbekistan":"🇺🇿","Scotland":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Korea Republic":"🇰🇷",
  "Argentina":"🇦🇷","Côte d'Ivoire":"🇨🇮","Haiti":"🇭🇹","Saudi Arabia":"🇸🇦","Senegal":"🇸🇳","Austria":"🇦🇹",
  "Turkey":"🇹🇷","Norway":"🇳🇴","Curaçao":"🇨🇼","Ghana":"🇬🇭","Japan":"🇯🇵","Germany":"🇩🇪",
};

const ALL_TEAMS = PLAYERS.flatMap(p => p.teams);
const SORTED_TEAMS = [...ALL_TEAMS].sort();
const teamToPlayer = {};
PLAYERS.forEach(p => p.teams.forEach(t => { teamToPlayer[t] = p.name; }));

const BONUS_STAGES = [
  { key:"gw",       label:"Group Winner",     pts:1,  icon:"🏅" },
  { key:"r16",      label:"Round of 16",      pts:2,  icon:"🔟" },
  { key:"qf",       label:"Quarter-final",    pts:4,  icon:"⚡" },
  { key:"sf",       label:"Semi-final",       pts:6,  icon:"🔥" },
  { key:"final",    label:"Final",            pts:8,  icon:"🌟" },
  { key:"champion", label:"World Cup Winner", pts:12, icon:"🏆" },
];

const DEFAULT_RESULTS = [
  { date:"11 Jun", home:"Mexico",            away:"South Africa",          hg:2, ag:0 },
  { date:"11 Jun", home:"Korea Republic",    away:"Czech Republic",        hg:2, ag:1 },
  { date:"12 Jun", home:"Canada",            away:"Bosnia and Herzegovina",hg:1, ag:1 },
  { date:"12 Jun", home:"United States",     away:"Paraguay",              hg:4, ag:1 },
  { date:"13 Jun", home:"Qatar",             away:"Switzerland",           hg:1, ag:1 },
  { date:"13 Jun", home:"Brazil",            away:"Morocco",               hg:1, ag:1 },
  { date:"13 Jun", home:"Scotland",          away:"Haiti",                 hg:1, ag:0 },
  { date:"14 Jun", home:"Australia",         away:"Turkey",                hg:2, ag:0 },
  { date:"14 Jun", home:"Germany",           away:"Curaçao",               hg:7, ag:1 },
  { date:"15 Jun", home:"Sweden",            away:"Tunisia",               hg:5, ag:1 },
  { date:"15 Jun", home:"Spain",             away:"Cape Verde Islands",    hg:0, ag:0 },
  { date:"15 Jun", home:"Belgium",           away:"Egypt",                 hg:1, ag:1 },
  { date:"15 Jun", home:"Saudi Arabia",      away:"Uruguay",               hg:1, ag:1 },
  { date:"15 Jun", home:"Côte d'Ivoire",     away:"Ecuador",               hg:1, ag:0 },
  { date:"15 Jun", home:"Netherlands",       away:"Japan",                 hg:2, ag:2 },
  { date:"16 Jun", home:"Iran",              away:"New Zealand",           hg:2, ag:2 },
  { date:"16 Jun", home:"France",            away:"Senegal",               hg:3, ag:1 },
  { date:"16 Jun", home:"Norway",            away:"Iraq",                  hg:4, ag:1 },
  { date:"16 Jun", home:"Argentina",         away:"Algeria",               hg:3, ag:0 },
];

const DEFAULT_BONUSES = (() => {
  const b = {};
  ALL_TEAMS.forEach(t => { b[t] = { gw:false,r16:false,qf:false,sf:false,final:false,champion:false }; });
  return b;
})();

// ── STATE (persisted to localStorage) ────────────────────────────────────────
function loadState() {
  try {
    const r = localStorage.getItem('wc26_results');
    const b = localStorage.getItem('wc26_bonuses');
    return {
      results: r ? JSON.parse(r) : DEFAULT_RESULTS,
      bonuses: b ? JSON.parse(b) : DEFAULT_BONUSES,
    };
  } catch { return { results: DEFAULT_RESULTS, bonuses: DEFAULT_BONUSES }; }
}

function saveState() {
  try {
    localStorage.setItem('wc26_results', JSON.stringify(state.results));
    localStorage.setItem('wc26_bonuses', JSON.stringify(state.bonuses));
  } catch {}
}

const saved = loadState();
const state = {
  results: saved.results,
  bonuses: saved.bonuses,
  tab: 'leaderboard',
  form: { date:'', home:'', away:'', hg:'', ag:'' },
  editIdx: null,
  bonusTeam: ALL_TEAMS[0],
};

// ── SCORING ───────────────────────────────────────────────────────────────────
function teamStats(team) {
  let wins = 0, draws = 0;
  state.results.forEach(({ home, away, hg, ag }) => {
    if (hg == null || ag == null) return;
    if (home === team || away === team) {
      const mine = home === team ? hg : ag;
      const theirs = home === team ? ag : hg;
      if (mine > theirs) wins++;
      else if (mine === theirs) draws++;
    }
  });
  return { wins, draws };
}

function calcPoints(team) {
  const { wins, draws } = teamStats(team);
  const b = state.bonuses[team] || {};
  return wins * 3 + draws * 1 + BONUS_STAGES.reduce((s, st) => s + (b[st.key] ? st.pts : 0), 0);
}

function playerTotals() {
  return PLAYERS.map(p => ({
    name: p.name,
    teams: p.teams,
    total: p.teams.reduce((s, t) => s + calcPoints(t), 0),
  })).sort((a, b) => b.total - a.total);
}

const MEDAL = ['🥇','🥈','🥉'];
const fmtPts = n => Number.isInteger(n) ? String(n) : n.toFixed(1);

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  renderTabs();
  renderContent();
}

function renderTabs() {
  const tabs = [
    ['leaderboard','🏆 Leaderboard'],
    ['bonuses','⭐ Knockouts'],
    ['results','📋 Results'],
    ['addresult','➕ Add Result'],
  ];
  document.getElementById('tabs').innerHTML = tabs.map(([t,l]) =>
    `<button class="tab-btn${state.tab===t?' active':''}" onclick="setTab('${t}')">${l}</button>`
  ).join('');
}

function renderContent() {
  const c = document.getElementById('content');
  if (state.tab === 'leaderboard') c.innerHTML = renderLeaderboard();
  else if (state.tab === 'bonuses') c.innerHTML = renderBonuses();
  else if (state.tab === 'results') c.innerHTML = renderResults();
  else if (state.tab === 'addresult') c.innerHTML = renderAddResult();
  attachFormListeners();
}

function renderLeaderboard() {
  const totals = playerTotals();
  const rows = totals.map((p, i) => {
    const isFirst = i === 0;
    const medal = i < 3 ? MEDAL[i] : `<span class="rank-num">#${i+1}</span>`;
    const teamCells = p.teams.map(t => {
      const pts = calcPoints(t);
      return `<div class="team-cell">
        <div class="team-flag">${FLAG[t]||'🏳'}</div>
        <div class="team-pts${pts>0?' active':''}">${pts>0?fmtPts(pts):'—'}</div>
      </div>`;
    }).join('');
    return `<div class="card${isFirst?' leader':''}">
      <div class="player-row">
        <div class="medal">${medal}</div>
        <div class="player-info">
          <div class="player-name${isFirst?' gold':''}">${p.name}</div>
          <div class="player-teams">${p.teams.map(t=>`${FLAG[t]||'🏳'} ${t}`).join(' · ')}</div>
        </div>
        <div class="player-pts">
          <div class="pts-num${isFirst?' gold':''}">${fmtPts(p.total)}</div>
          <div class="pts-label">PTS</div>
        </div>
      </div>
      <div class="team-strip">${teamCells}</div>
    </div>`;
  }).join('');

  const scoring = [
    ['Match Win','3 pts'],['Match Draw','1 pt'],['Round of 16','2 pts'],['Group Winner','1 pt'],
    ['Quarter-final','4 pts'],['Semi-final','6 pts'],['Final','8 pts'],['World Cup Winner','12 pts'],
  ].map(([l,v]) => `<div class="scoring-row"><span class="scoring-label">${l}</span><span class="scoring-val">${v}</span></div>`).join('');

  return `${rows}
  <div class="card" style="padding:14px 16px;margin-top:4px">
    <div class="section-label">Scoring System</div>
    <div class="scoring-grid">${scoring}</div>
  </div>`;
}

function renderBonuses() {
  const t = state.bonusTeam;
  const b = state.bonuses[t] || {};
  const pts = calcPoints(t);

  const teamSelect = SORTED_TEAMS.map(team =>
    `<option value="${esc(team)}"${team===t?' selected':''}>${FLAG[team]||'🏳'} ${team} (${teamToPlayer[team]})</option>`
  ).join('');

  const bonusRows = BONUS_STAGES.map(({ key, label, pts: p, icon }) => {
    const on = !!b[key];
    return `<button class="bonus-row${on?' on':''}" onclick="toggleBonus('${esc(t)}','${key}')">
      <div class="bonus-left">
        <span class="bonus-check">${on?'✅':'⬜'}</span>
        <span class="bonus-text${on?' on':''}">${icon} ${label}</span>
      </div>
      <span class="bonus-pts-badge">+${p} pt${p!==1?'s':''}</span>
    </button>`;
  }).join('');

  const awarded = ALL_TEAMS.filter(team => BONUS_STAGES.some(s => state.bonuses[team]?.[s.key]));
  const awardedRows = awarded.length === 0
    ? '<div class="empty-msg">No bonus points awarded yet.</div>'
    : awarded.map(team => {
        const badges = BONUS_STAGES.filter(s => state.bonuses[team]?.[s.key])
          .map(s => `<span class="badge">${s.icon} ${s.label}</span>`).join('');
        return `<div class="bonus-summary-row">
          <span style="font-size:16px">${FLAG[team]||'🏳'}</span>
          <span style="font-size:13px;flex-shrink:0">${team}</span>
          <div class="bonus-badges">${badges}</div>
        </div>`;
      }).join('');

  return `
  <div class="bonus-pick">
    <label>Select Team</label>
    <select onchange="setBonusTeam(this.value)">${teamSelect}</select>
  </div>
  <div class="bonus-team-card">
    <div class="bonus-team-header">
      <div class="bonus-team-left">
        <span class="bonus-flag">${FLAG[t]||'🏳'}</span>
        <div>
          <div class="bonus-team-name">${t}</div>
          <div class="bonus-team-owner">${teamToPlayer[t]}</div>
        </div>
      </div>
      <div class="bonus-team-pts">
        <div class="bonus-pts-num">${fmtPts(pts)}</div>
        <div class="pts-label">TOTAL PTS</div>
      </div>
    </div>
    ${bonusRows}
  </div>
  <div class="all-bonuses">
    <div class="section-label">All Bonus Points Awarded</div>
    ${awardedRows}
  </div>`;
}

function renderResults() {
  if (state.results.length === 0)
    return '<div style="color:var(--dim);font-size:13px">No results yet. Add one!</div>';

  return `<div style="font-size:13px;color:var(--dim);margin-bottom:10px">${state.results.length} results entered</div>`
    + state.results.map((r, i) => {
      const hOwner = teamToPlayer[r.home] || '';
      const aOwner = teamToPlayer[r.away] || '';
      const owners = [hOwner, aOwner].filter(Boolean);
      const ownerStr = owners.length === 2 && hOwner !== aOwner
        ? `${hOwner} vs ${aOwner}` : owners[0] || '';
      return `<div class="result-card">
        <div class="result-date">${r.date}</div>
        <div class="result-match">
          <div class="result-score">
            <span>${FLAG[r.home]||'🏳'} ${r.home}</span>
            <span class="score-num">${r.hg}–${r.ag}</span>
            <span>${r.away} ${FLAG[r.away]||'🏳'}</span>
          </div>
          ${ownerStr ? `<div class="result-owners">${ownerStr}</div>` : ''}
        </div>
        <button class="btn-edit" onclick="editResult(${i})">Edit</button>
        <button class="btn-delete" onclick="deleteResult(${i})">✕</button>
      </div>`;
    }).join('');
}

function renderAddResult() {
  const f = state.form;
  const teamOpts = SORTED_TEAMS.map(t =>
    `<option value="${esc(t)}"${t===f.home?' selected':''}>${FLAG[t]||'🏳'} ${t}</option>`
  ).join('');
  const awayOpts = SORTED_TEAMS.map(t =>
    `<option value="${esc(t)}"${t===f.away?' selected':''}>${FLAG[t]||'🏳'} ${t}</option>`
  ).join('');

  let preview = '';
  if (f.home && f.away && f.hg !== '' && f.ag !== '') {
    const h = Number(f.hg), a = Number(f.ag);
    let hint = '';
    if (h > a) hint = `${f.home} win → +3 pts for ${teamToPlayer[f.home]||'?'}`;
    else if (a > h) hint = `${f.away} win → +3 pts for ${teamToPlayer[f.away]||'?'}`;
    else hint = `Draw → +1 pt each`;
    preview = `<div class="preview">
      ${FLAG[f.home]||'🏳'} ${f.home} <span style="color:var(--gold);font-size:20px"> ${f.hg}–${f.ag} </span> ${f.away} ${FLAG[f.away]||'🏳'}
      <div class="preview-hint">${hint}</div>
    </div>`;
  }

  const isEdit = state.editIdx !== null;
  return `<div class="form-section">
    <div class="form-title">${isEdit ? '✏️ Edit Result' : '➕ Add New Result'}</div>
    <div class="form-grid">
      <div>
        <label>Date</label>
        <input id="f-date" value="${esc(f.date)}" placeholder="e.g. 17 Jun" oninput="updateForm('date',this.value)">
      </div>
      <div class="form-col2">
        <div>
          <label>Home Team</label>
          <select id="f-home" onchange="updateForm('home',this.value)">
            <option value="">Select…</option>${teamOpts}
          </select>
        </div>
        <div>
          <label>Away Team</label>
          <select id="f-away" onchange="updateForm('away',this.value)">
            <option value="">Select…</option>${awayOpts}
          </select>
        </div>
      </div>
      <div class="form-col2">
        <div>
          <label>Home Goals</label>
          <input id="f-hg" class="goals" type="number" min="0" value="${esc(f.hg)}" placeholder="0" oninput="updateForm('hg',this.value)">
        </div>
        <div>
          <label>Away Goals</label>
          <input id="f-ag" class="goals" type="number" min="0" value="${esc(f.ag)}" placeholder="0" oninput="updateForm('ag',this.value)">
        </div>
      </div>
      ${preview}
      <div class="btn-row">
        <button class="btn-primary" style="flex:1" onclick="submitResult()">${isEdit ? 'Save Changes' : 'Add Result'}</button>
        ${isEdit ? `<button class="btn-secondary" onclick="cancelEdit()">Cancel</button>` : ''}
      </div>
    </div>
  </div>`;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function setTab(t) { state.tab = t; render(); }
function setBonusTeam(t) { state.bonusTeam = t; render(); }

function toggleBonus(team, key) {
  state.bonuses[team][key] = !state.bonuses[team][key];
  saveState();
  render();
}

function updateForm(field, val) {
  state.form[field] = val;
  // Re-render just the preview area without full re-render to avoid losing focus
  const f = state.form;
  const previewEl = document.querySelector('.preview');
  const insertBefore = document.querySelector('.btn-row');
  if (!insertBefore) return;

  // Remove old preview
  if (previewEl) previewEl.remove();

  if (f.home && f.away && f.hg !== '' && f.ag !== '') {
    const h = Number(f.hg), a = Number(f.ag);
    let hint = '';
    if (h > a) hint = `${f.home} win → +3 pts for ${teamToPlayer[f.home]||'?'}`;
    else if (a > h) hint = `${f.away} win → +3 pts for ${teamToPlayer[f.away]||'?'}`;
    else hint = `Draw → +1 pt each`;
    const div = document.createElement('div');
    div.className = 'preview';
    div.innerHTML = `${FLAG[f.home]||'🏳'} ${f.home} <span style="color:var(--gold);font-size:20px"> ${f.hg}–${f.ag} </span> ${f.away} ${FLAG[f.away]||'🏳'}<div class="preview-hint">${hint}</div>`;
    insertBefore.parentNode.insertBefore(div, insertBefore);
  }
}

function submitResult() {
  const f = state.form;
  if (!f.home || !f.away || f.hg === '' || f.ag === '') return;
  const entry = { date: f.date || '?', home: f.home, away: f.away, hg: Number(f.hg), ag: Number(f.ag) };
  if (state.editIdx !== null) {
    state.results[state.editIdx] = entry;
    state.editIdx = null;
  } else {
    state.results.push(entry);
  }
  state.form = { date:'', home:'', away:'', hg:'', ag:'' };
  saveState();
  state.tab = 'leaderboard';
  render();
}

function editResult(i) {
  state.editIdx = i;
  const r = state.results[i];
  state.form = { date: r.date, home: r.home, away: r.away, hg: String(r.hg), ag: String(r.ag) };
  state.tab = 'addresult';
  render();
}

function deleteResult(i) {
  state.results.splice(i, 1);
  saveState();
  render();
}

function cancelEdit() {
  state.editIdx = null;
  state.form = { date:'', home:'', away:'', hg:'', ag:'' };
  render();
}

function attachFormListeners() {}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── INSTALL PROMPT (Android Chrome) ──────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

// ── INIT ──────────────────────────────────────────────────────────────────────
render();

// ── SERVICE WORKER (offline support) ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
